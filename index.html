
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1e272e;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 320px;
            padding: 20px;
            background: #2f3640;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        #display {
            width: 100%;
            height: 70px;
            margin-bottom: 15px;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #dcdde1;
            color: #222;
            text-align: right;
            font-size: 30px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 55px;
            border: none;
            border-radius: 8px;
            background: #718093;
            color: white;
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #a4b0be;
        }

        .operator {
            background: #e67e22;
        }

        .operator:hover {
            background: #f39c12;
        }

        .clear {
            background: #e84118;
        }

        .equal {
            background: #44bd32;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="calculator">
        <input type="text" id="display" value="0"
               readonly aria-label="Calculator display">

        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">AC</button>
            <button onclick="deleteLast()">DEL</button>
            <button class="operator" onclick="chooseOperator('%')">%</button>
            <button class="operator" onclick="chooseOperator('/')">÷</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="chooseOperator('*')">×</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="chooseOperator('-')">−</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="chooseOperator('+')">+</button>

            <button class="zero" onclick="appendNumber('0')">0</button>
            <button onclick="appendNumber('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById("display");

        let firstNumber = null;
        let operator = null;
        let waitingForSecond = false;

        function appendNumber(number) {
            if (display.value === "Error") {
                clearDisplay();
            }

            if (waitingForSecond) {
                display.value = number === "." ? "0." : number;
                waitingForSecond = false;
                return;
            }

            if (number === ".") {
                if (display.value.includes(".")) return;
                display.value += ".";
                return;
            }

            display.value =
                display.value === "0"
                    ? number
                    : display.value + number;
        }

        function chooseOperator(op) {
            if (display.value === "Error") return;

            if (operator && !waitingForSecond) {
                calculate();
            }

            firstNumber = Number(display.value);
            operator = op;
            waitingForSecond = true;
        }

        function calculate() {
            if (operator === null || waitingForSecond) return;

            const secondNumber = Number(display.value);
            let result;

            switch (operator) {
                case "+":
                    result = firstNumber + secondNumber;
                    break;
                case "-":
                    result = firstNumber - secondNumber;
                    break;
                case "*":
                    result = firstNumber * secondNumber;
                    break;
                case "/":
                    result = secondNumber === 0
                        ? "Error"
                        : firstNumber / secondNumber;
                    break;
                case "%":
                    result = firstNumber % secondNumber;
                    break;
            }

            display.value =
                typeof result === "number" && Number.isFinite(result)
                    ? String(Number(result.toPrecision(12)))
                    : "Error";

            firstNumber = null;
            operator = null;
            waitingForSecond = true;
        }

        function clearDisplay() {
            display.value = "0";
            firstNumber = null;
            operator = null;
            waitingForSecond = false;
        }

        function deleteLast() {
            if (display.value === "Error" || waitingForSecond) {
                display.value = "0";
                waitingForSecond = false;
                return;
            }

            display.value = display.value.length > 1
                ? display.value.slice(0, -1)
                : "0";
        }
    </script>

</body>
</html>
